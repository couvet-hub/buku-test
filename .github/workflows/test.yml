name: Test JSON 5 Soal 4 Metode
on:
  workflow_dispatch: # jalanin manual

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 0. HAPUS SAMPAH RUNNER BIAR LEGA 10GB
        run: |
          echo "=== DISK SEBELUM ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          echo "=== DISK SESUDAH ==="
          df -h

      - name: 1. Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: 2. Download Qwen CLI + Model 7B Q4
        run: |
          wget -q https://github.com/ggerganov/llama.cpp/releases/download/b5054/llama-b5054-bin-ubuntu-x64.zip
          unzip -q llama-b5054-bin-ubuntu-x64.zip
          mv llama-b5054-bin-ubuntu-x64 llama.cpp
          wget -q https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF/resolve/main/qwen2.5-7b-instruct-q4_k_m.gguf
          ls -lh qwen2.5-7b-instruct-q4_k_m.gguf

      - name: 3. AUTO DOWNLOAD BUKU SMP KELAS 7
        run: |
          mkdir -p data
          wget -q -O data/kurikulum.pdf "https://cdn.kemdikbud.go.id/salinan-buku-kurikulum-merdeka/SMP/Kelas_7/Matematika/Buku_Siswa_Matematika_Kelas_7.pdf"
          pdftotext data/kurikulum.pdf data/kurikulum.txt
          head -c 5000 data/kurikulum.txt > data/materi.txt

      - name: 4. GABUNG MATERI + PROMPT
        run: |
          MATERI_ESCAPED=$(cat data/materi.txt | sed 's/"/\\"/g' | tr '\n' ' ')
          sed "s/{MATERI}/$MATERI_ESCAPED/g" prompt.txt > data/final_prompt.txt
          echo "Prompt siap. Panjang: $(wc -c < data/final_prompt.txt) karakter"

      - name: 5. TEST Qwen Bikin 5 Soal x 4 Metode
        timeout-minutes: 20
        run: |
          ./llama.cpp/llama-cli -m qwen2.5-7b-instruct-q4_k_m.gguf \
            --system "Kamu profesor matematika. Output HANYA JSON valid." \
            --prompt "$(cat data/final_prompt.txt)" \
            -n 4096 --temp 0.1 --repeat-penalty 1.1 > data/hasil_test.json
          cat data/hasil_test.json

      - name: 6. UPLOAD JSON BUAT DICEK
        uses: actions/upload-artifact@v4
        with:
          name: hasil-json-test
          path: data/hasil_test.json
          retention-days: 7
