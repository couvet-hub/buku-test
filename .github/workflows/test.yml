name: Generate 50 Soal

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Generate Soal
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          python - <<'EOF'
          import os, requests, json
          
          API_KEY = os.environ["TOGETHER_API_KEY"]
          API_URL = "https://api.together.xyz/v1/chat/completions"
          MODEL = "Qwen/Qwen2.5-7B-Instruct-Turbo" # INI MODELNYA UDAH DISET
          
          headers = {"Authorization": f"Bearer {API_KEY}"}
          
          prompt = "Buatkan 50 soal pilihan ganda Bahasa Indonesia untuk SD kelas 5. Format JSON: [{\"soal\": \"...\", \"a\": \"...\", \"b\": \"...\", \"c\": \"...\", \"d\": \"...\", \"jawaban\": \"A\"}]"
          
          data = {
            "model": MODEL, # GAK PERLU GANTI2
            "messages": [{"role": "user", "content": prompt}],
            "temperature": 0.7
          }
          
          res = requests.post(API_URL, headers=headers, json=data)
          result = res.json()["choices"][0]["message"]["content"]
          
          with open("hasil-50-soal.json", "w", encoding="utf-8") as f:
              f.write(result)
          print("Selesai! File hasil-50-soal.json dibuat")
          EOF
          
      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: hasil-50-soal-together
          path: hasil-50-soal.json
